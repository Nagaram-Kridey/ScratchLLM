[project]
name = "scratchllm"
version = "0.1.0"
description = "An English chat language model built from scratch on PyTorch"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["torch"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["scratchllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Failed to initialize NumPy"]
